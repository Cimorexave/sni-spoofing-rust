name: Build & Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  test:
    name: Run tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run auto-runner tests
        run: python runner/test_auto_runner.py

  build-windows:
    name: Build Windows binary
    runs-on: windows-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: x86_64-pc-windows-msvc

      - name: Build release binary
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: sni-spoof-rs-exe
          path: target/x86_64-pc-windows-msvc/release/sni-spoof-rs.exe
          retention-days: 1

  package-auto-runner:
    name: Package auto-runner ZIP
    runs-on: windows-latest
    needs: [build-windows]
    steps:
      - uses: actions/checkout@v4

      - name: Download built binary
        uses: actions/download-artifact@v4
        with:
          name: sni-spoof-rs-exe
          path: target/release/

      - name: Extract WinDivert files from upstream release zip
        shell: powershell
        run: |
          if (Test-Path 'releases/sni-spoof-rs-windows-amd64.zip') {
            Add-Type -AssemblyName System.IO.Compression.FileSystem
            $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path 'releases/sni-spoof-rs-windows-amd64.zip'))
            New-Item -ItemType Directory -Path windivert -Force | Out-Null
            foreach ($entry in $zip.Entries) {
              $name = $entry.Name
              if ($name -match '^(WinDivert64\.sys|WinDivert\.dll)$') {
                $dest = "windivert\$name"
                [System.IO.Compression.ZipFileExtensions]::ExtractToFile($entry, $dest, $true)
                Write-Host "Extracted: $name"
              }
            }
            $zip.Dispose()
          } else {
            Write-Warning "Upstream release zip not found. WinDivert files will be missing."
          }

      - name: Create staging directory and populate files
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path staging -Force | Out-Null
          Copy-Item target/release/sni-spoof-rs.exe staging/sni-spoof-rs.exe -Force
          if (Test-Path windivert/WinDivert64.sys) { Copy-Item windivert/WinDivert64.sys staging/WinDivert64.sys -Force }
          if (Test-Path windivert/WinDivert.dll) { Copy-Item windivert/WinDivert.dll staging/WinDivert.dll -Force }
          Copy-Item runner/auto-runner.bat staging/auto-runner.bat -Force
          Copy-Item runner/config.json staging/config.json -Force
          if (Test-Path runner/cfgs.txt) { Copy-Item runner/cfgs.txt staging/cfgs.txt -Force }

      - name: Create README.txt
        shell: powershell
        run: |
          $repo = $env:GITHUB_REPOSITORY
          $ver = $env:GITHUB_REF_NAME
          $lines = @(
            "============================================"
            "  SNI Spoof Auto-Runner for Windows"
            "  Version: $ver"
            "============================================"
            ""
            "QUICK START:"
            "  1. Right-click 'auto-runner.bat' -> Run as Administrator"
            "  2. The runner will find a working Cloudflare IP and SNI"
            "  3. It will show your V2Ray config in a popup"
            "  4. It will launch sni-spoof-rs.exe automatically"
            "  5. Connect with your v2ray/xray client to 127.0.0.1:40443"
            ""
            "REQUIREMENTS:"
            "  - Windows 10/11 (64-bit)"
            "  - Administrator privileges (required for WinDivert driver)"
            ""
            "FILES IN THIS PACKAGE:"
            "  - sni-spoof-rs.exe     - The core DPI bypass proxy"
            "  - WinDivert64.sys      - WinDivert kernel driver"
            "  - WinDivert.dll        - WinDivert user-mode library"
            "  - auto-runner.bat      - Entry point (double-click this)"
            "  - config.json          - Proxy configuration"
            "  - cfgs.txt             - Your V2Ray/Trojan configs (add your own)"
            ""
            "CUSTOMIZATION:"
            "  Edit cfgs.txt to add your own V2Ray/Trojan subscription configs."
            "  The runner will test each one and pick the first working config."
            ""
            "TROUBLESHOOTING:"
            "  - Make sure you run as Administrator"
            "  - If your antivirus flags WinDivert64.sys, add an exclusion"
            "  - Check RUST_LOG=debug for verbose logging"
            ""
            "SOURCE & UPDATES:"
            "  https://github.com/$repo"
            ""
          )
          $lines -join "`r`n" | Out-File -FilePath staging/README.txt -Encoding ASCII

      - name: Create ZIP
        shell: powershell
        run: |
          $version = $env:GITHUB_REF_NAME
          $zipName = "sni-spoof-rs-windows-amd64-auto-$version.zip"
          Compress-Archive -Path staging\* -DestinationPath $zipName -Force
          Write-Host "Created: $zipName"
          Add-Content -Path $env:GITHUB_ENV -Value "ZIP_NAME=$zipName"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: auto-runner-zip
          path: sni-spoof-rs-windows-amd64-auto-*.zip
          retention-days: 1

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [package-auto-runner]
    steps:
      - uses: actions/checkout@v4

      - name: Download auto-runner zip
        uses: actions/download-artifact@v4
        with:
          name: auto-runner-zip

      - name: Generate release notes
        run: |
          cat > release-notes.md << 'EOF'
          ## Auto-Runner Release

          ### What's Included
          - `sni-spoof-rs.exe` — Core DPI bypass proxy
          - `WinDivert64.sys` + `WinDivert.dll` — WinDivert driver
          - `auto-runner.bat` — Automated IP/SNI finder and launcher
          - `config.json` — Default proxy configuration

          ### Usage
          1. Extract the ZIP anywhere
          2. Right-click `auto-runner.bat` → **Run as Administrator**
          3. The runner will find a working config and launch the proxy
          4. Connect your v2ray/xray client to `127.0.0.1:40443`
          EOF

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            sni-spoof-rs-windows-amd64-auto-*.zip
